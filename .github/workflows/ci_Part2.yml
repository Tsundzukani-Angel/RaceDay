name: RaceDay API CI

on:
  push:
    branches: [ main, part2-api, part3-mvc ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.slnx

      - name: Build solution
        run: dotnet build RaceDay.API/RaceDay.API.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.API/RaceDay.API.Tests/RaceDay.API.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'