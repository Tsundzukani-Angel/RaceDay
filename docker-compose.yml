services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"

  api:
    image: raceday-api
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__RaceDayConnection=Server=db;Database=RaceDayDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - AzureStorage__ConnectionString=${AZURE_CONNECTION_STRING}
    ports:
      - "7112:8080"
    depends_on:
      - db

  mvc:
    image: raceday-mvc
    build:
      context: .
      dockerfile: RaceDay.MVC/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://api:8080
    ports:
      - "5001:8080"
    depends_on:
      - api